name: Redux SDK contract

on:
  push:
    paths:
      - "speechscope/**"
      - "tests/test_redux.py"
      - "pyproject.toml"
      - ".github/workflows/redux-sdk-compat.yml"
  pull_request:
    paths:
      - "speechscope/**"
      - "tests/test_redux.py"
      - "pyproject.toml"
      - ".github/workflows/redux-sdk-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-contract:
    name: Redux contract (${{ matrix.sdk_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_name: minimum
            install_spec: "moondream==2.4.1"
            expected_version: "2.4.1"
          - sdk_name: latest-supported-2x
            install_spec: "moondream<3"
            expected_version: ""
    env:
      SPEECHSCOPE_EXPECTED_MOONDREAM_VERSION: ${{ matrix.expected_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" "${{ matrix.install_spec }}"
      - run: python -m pytest -q -m "not integration" tests/test_redux.py
