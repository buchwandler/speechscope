name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate semantic release tag
        id: tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a clean vMAJOR.MINOR.PATCH tag; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Install release validation dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.tag.outputs.version }}
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.tag.outputs.version }}
        run: python -m pytest -q -m "not integration"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy speechscope
      - run: python -m compileall -q speechscope examples
      - name: Build, validate, and smoke-test release artifacts
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python -m build
          python -m twine check dist/*
          WHEEL=$(printf '%s\n' dist/*.whl)
          SDIST=$(printf '%s\n' dist/*.tar.gz)
          python -m venv /tmp/speechscope-wheel
          /tmp/speechscope-wheel/bin/python -m pip install "$WHEEL"
          cd /tmp
          /tmp/speechscope-wheel/bin/python -c 'import importlib.metadata,pathlib,speechscope,os; d=importlib.metadata.distribution("speechscope"); assert d.version==speechscope.__version__==os.environ["RELEASE_VERSION"]; assert pathlib.Path(speechscope.__file__).parent.joinpath("py.typed").is_file(); assert pathlib.Path(speechscope.__file__).parent.joinpath("schemas/report-v1.schema.json").is_file(); assert any("licenses/LICENSE" in str(p) for p in d.files)'
          /tmp/speechscope-wheel/bin/speechscope --version
          /tmp/speechscope-wheel/bin/speechscope metrics list
          /tmp/speechscope-wheel/bin/speechscope backends list --format json
          python -m venv /tmp/speechscope-sdist
          /tmp/speechscope-sdist/bin/python -m pip install "$GITHUB_WORKSPACE/$SDIST"
          cd /tmp
          /tmp/speechscope-sdist/bin/python -c 'import importlib.metadata,pathlib,speechscope,os; d=importlib.metadata.distribution("speechscope"); assert d.version==speechscope.__version__==os.environ["RELEASE_VERSION"]; assert pathlib.Path(speechscope.__file__).parent.joinpath("py.typed").is_file(); assert pathlib.Path(speechscope.__file__).parent.joinpath("schemas/report-v1.schema.json").is_file(); assert any("licenses/LICENSE" in str(p) for p in d.files)'
          /tmp/speechscope-sdist/bin/speechscope --version
          /tmp/speechscope-sdist/bin/speechscope metrics list
          /tmp/speechscope-sdist/bin/speechscope backends list --format json
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/speechscope
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
